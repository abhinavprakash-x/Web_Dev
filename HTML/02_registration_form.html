<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form>
        <label for = "name">Enter Name: </label>
        <input type = "text" id = "name" name = "name" required>
        <br> <br>

        <label for = "email">Email: </label>
        <input type = "email" id = "email" name = "email" placeholder = "eg@dns.com" required>
        <br><br>

        <label for = "pass">Password: </label>
        <input type = "password" id = "pass" name = "pass" required>
        <br><br>

        <label for = "age">Age: </label>
        <input type = "number" id = "age" name = "age" required>
        <br><br>

        Gender: 
        <input type = "radio" id = "male" name = "gender" value = "male">
        <label for = "male">Male</label>

        <input type = "radio" id = "female" name = "gender" value = "female">
        <label for = "female">Female</label>
        <br><br>

        <label>Languages: </label>
        <input type="checkbox" id="english" name="lang" value="en">
        <label for="english">English</label>

        <input type="checkbox" id="hindi" name="lang" value="hi">
        <label for="hindi">Hindi</label>

        <input type="checkbox" id="bengali" name="lang" value="bg">
        <label for="bengali">Bengali</label>
        <br><br>

        <label for = "resume">Upload Resume: </label>
        <input type = "file" id = "resume" name = "resume">
        <br><br>

        <label for = "branch">Select Branch: </label>
        <select id = "branch" name = "branch">
            <option value="" selected disabled>Select Branch</option>
            <option value = "CSE">CSE</option>
            <option value = "IT">IT</option>
            <option value = "AIML">AIML</option>
        </select>
        <br><br>

        <label for = "about">About Yourself: </label>
        <textarea rows = "5" cols = "40" id = "about" name = "about" required>
        </textarea>
        <br><br>

        <button type = "submit">Submit</button>
    </form>
</body>
</html>
