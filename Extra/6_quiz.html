<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhinav</title>
    <link rel="stylesheet" href="6_quiz.css">
</head>
<body>
    <div class="container">
        <h1>Quiz</h1>
        <form id="quizForm">
            <div class="item">
                <p id="q1">Q1. What is the capital of France?</p>
                <label><input type="radio" name="q1" value="Paris">Paris</label>
                <label><input type="radio" name="q1" value="London">London</label>
                <label><input type="radio" name="q1" value="Berlin">Berlin</label>
                <label><input type="radio" name="q1" value="Madrid">Madrid</label>
            </div>

            <div class="item">
                <p id="q2">Q2. What is 2 + 2?</p>
                <label><input type="radio" name="q2" value="3">3</label>
                <label><input type="radio" name="q2" value="4">4</label>
                <label><input type="radio" name="q2" value="5">5</label>
                <label><input type="radio" name="q2" value="6">6</label>
            </div>

            <div class="item">
                <p id="q3">Q3. What is the largest planet in our solar system?</p>
                <label><input type="radio" name="q3" value="Earth">Earth</label>
                <label><input type="radio" name="q3" value="Jupiter">Jupiter</label>
                <label><input type="radio" name="q3" value="Mars">Mars</label>
                <label><input type="radio" name="q3" value="Venus">Venus</label>
            </div>

            <div class="item">
                <p id="q4">Q4. What is the chemical symbol for water?</p>
                <label><input type="radio" name="q4" value="H2O">H2O</label>
                <label><input type="radio" name="q4" value="O2">O2</label>
                <label><input type="radio" name="q4" value="CO2">CO2</label>
                <label><input type="radio" name="q4" value="NaCl">NaCl</label>
            </div>

            <div class="item">
                <p id="q5">Q5. What is the largest ocean on Earth?</p>
                <label><input type="radio" name="q5" value="Atlantic Ocean">Atlantic Ocean</label>
                <label><input type="radio" name="q5" value="Indian Ocean">Indian Ocean</label>
                <label><input type="radio" name="q5" value="Arctic Ocean">Arctic Ocean</label>
                <label><input type="radio" name="q5" value="Pacific Ocean">Pacific Ocean</label>
            </div>

            <button id="submit">Submit</button>
        </form>
    </div>
    <script src="6_quiz.js"></script>
</body>
</html>
