<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhinav</title>
    <link rel="stylesheet" href="7_astrology.css">
</head>
<body>
    <div class="container">
        <div class="form">
            <h1>Astrology Predictor</h1>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <button type="submit" id="button">Get Horoscope</button>
        </div>

        <div class="result" id="result">
            <h2>Predictions</h2>
            <p id="horoscope_name"></p>
            <p id="horoscope_sign"></p>
            <p id="pred1"></p>
            <p id="pred2"></p>
            <p id="pred3"></p>
            <p id="pred4"></p>
        </div>
    </div>
    <script src="7_astrology.js"></script>
</body>
</html>
